# Mêmes réglages que dans l'interface Netlify : on construit avec build.py, on publie dist/.
# dist/ est aussi versionné, pour que le site marche même si la commande de build ne tourne pas.
[build]
  command = "python3 build.py"
  publish = "dist"

# La page et sa version ne doivent jamais rester en cache : l'appli se met à jour toute seule.
[[headers]]
  for = "/version.json"
  [headers.values]
    Cache-Control = "no-store"
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache"
